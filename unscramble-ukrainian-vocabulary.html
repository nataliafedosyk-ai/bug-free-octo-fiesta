<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Розшифруй українські слова</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--text:#202536;--muted:#687083;--line:#d9deea;--primary:#5367d8;--primary-soft:#e9ecff;--good:#23864d;--bad:#a43d3d;--shadow:0 8px 24px rgba(32,37,54,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.container{max-width:900px;min-height:100vh;margin:auto;padding:28px 20px;display:flex;flex-direction:column}.header{margin-bottom:24px}.header h1{margin:0 0 8px;font-size:clamp(1.35rem,3vw,2rem)}.instruction{color:var(--muted);font-size:1rem}.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:24px}.tab-button{padding:11px 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer;font-size:1rem}.tab-button.active{color:var(--text);border-bottom-color:var(--primary);font-weight:700}.progress-bar{display:flex;align-items:center;gap:12px;margin-bottom:26px;color:var(--muted);font-size:.9rem}.progress-track{height:9px;flex:1;background:#e5e8f0;border-radius:9px;overflow:hidden}.progress-fill{height:100%;background:var(--primary);transition:width .25s}.word-section{display:flex;flex-direction:column;gap:16px}.word-label{color:var(--muted);font-size:.9rem;text-transform:uppercase;letter-spacing:.06em}.scrambled-tiles,.answer-area{display:flex;flex-wrap:wrap;gap:8px;min-height:72px;padding:16px;border-radius:12px}.scrambled-tiles{background:#e9ebf2}.answer-area{border:2px solid var(--line);background:var(--card);align-items:center}.tile,.answer-tile{min-width:42px;padding:11px 13px;border-radius:9px;text-align:center;font-size:1.15rem;font-weight:600;cursor:pointer;user-select:none;box-shadow:0 2px 5px rgba(0,0,0,.05)}.tile{background:var(--card);border:1px solid var(--line)}.answer-tile{background:var(--primary-soft);border:1px solid var(--primary)}.tile:hover,.answer-tile:hover{transform:translateY(-2px)}.placeholder{color:var(--muted);font-size:.9rem}.feedback{padding:13px;border-radius:10px;text-align:center;font-weight:700}.feedback.correct{background:#dff3e7;color:var(--good)}.feedback.incorrect{background:#f8e1e1;color:var(--bad)}.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}button{padding:11px 15px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);cursor:pointer;font-size:.98rem}button:hover:not(:disabled){background:#eef0f6}button:disabled{opacity:.45;cursor:not-allowed}.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}.score-note{color:var(--muted);font-size:.92rem}.results-view{display:flex;flex-direction:column;gap:14px;max-width:600px;margin:40px auto;width:100%}.results-title{text-align:center;font-size:1.8rem;font-weight:750;margin-bottom:12px}.page-score{padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;justify-content:space-between}.page-score-label{color:var(--muted)}.page-score-value{font-weight:750;color:var(--primary)}.overall-score{padding:20px;background:var(--primary-soft);border:2px solid var(--primary);border-radius:12px;text-align:center;margin-top:6px}.overall-score-label{color:var(--muted)}.overall-score-value{font-size:2rem;font-weight:800;color:var(--primary)}.restart-button{width:100%;margin-top:8px}@media(max-width:600px){.container{padding:20px 12px}.tile,.answer-tile{min-width:36px;padding:9px 10px;font-size:1rem}.controls button{flex:1}.progress-bar{gap:8px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const PAGES={
 family:{name:'Сім\'я',words:['дядько','тітка','дідусь','двоюрідний брат','двоюрідна сестра','сестра','брат','бабуся','племінник','племінниця','прадідусь','прабабуся','мати','мама','батько','тато']},
 professions:{name:'Професії та заняття',words:['журналіст','офіціант','інженер','школяр','студент','вчитель','актор','пенсіонер','художник','водій','лікар','юрист','будівельник','співак','медсестра','продавець','фермер','письменник','кухар']},
 numbers:{name:'Числа',words:['один','два','три','чотири','п\'ять','шість','сім','вісім','дев\'ять','десять','дванадцять','тринадцять','чотирнадцять','п\'ятнадцять','шістьнадцять','сімнадцять','дев\'ятнадцять','двадцять']}
};
const keys=Object.keys(PAGES);let state={page:'family',index:{family:0,professions:0,numbers:0},answers:{family:[],professions:[],numbers:[]},tiles:{family:[],professions:[],numbers:[]},feedback:{family:'',professions:'',numbers:''},scores:{family:0,professions:0,numbers:0},answered:{family:0,professions:0,numbers:[]},results:false};
state.answered={family:0,professions:0,numbers:0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function scramble(w){let a=shuffle(Array.from(w));if(a.join('')===w&&a.length>1)[a.length-1]=a[0],[a[0]]=a[a.length-1];return a}
function init(){keys.forEach(k=>state.tiles[k]=scramble(PAGES[k].words[0]));render()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const app=document.getElementById('app');if(state.results){let total=0;keys.forEach(k=>total+=state.scores[k]);app.innerHTML='<div class="container"><div class="results-view"><div class="results-title">Підсумковий результат</div>'+keys.map(k=>'<div class="page-score"><span class="page-score-label">'+esc(PAGES[k].name)+'</span><span class="page-score-value">'+state.scores[k]+'/'+PAGES[k].words.length+'</span></div>').join('')+'<div class="overall-score"><div class="overall-score-label">Загальний результат</div><div class="overall-score-value">'+total+'/53</div></div><button class="btn-primary restart-button" data-action="restart">Розпочати знову</button></div></div>';return}
const k=state.page,p=PAGES[k],i=state.index[k],word=p.words[i],ans=state.answers[k],tiles=state.tiles[k],f=state.feedback[k],done=!!(f==='correct');app.innerHTML='<div class="container"><div class="header"><h1>Розшифруй українські слова</h1><div class="instruction">Переставте літери, щоб утворити правильне слово.</div></div><div class="tabs">'+keys.map(x=>'<button class="tab-button '+(x===k?'active':'')+'" data-page="'+x+'">'+esc(PAGES[x].name)+'</button>').join('')+'</div><div class="progress-bar"><span>Прогрес</span><div class="progress-track"><div class="progress-fill" style="width:'+((i+1)/p.words.length*100)+'%"></div></div><span>'+(i+1)+'/'+p.words.length+'</span></div><div class="word-section"><div class="word-label">Слово '+(i+1)+'</div><div class="scrambled-tiles">'+(tiles.length?tiles.map((c,n)=>'<div class="tile" data-from="tiles" data-index="'+n+'">'+esc(c)+'</div>').join(''):'<span class="placeholder">Усі літери вибрано</span>')+'</div><div class="answer-area">'+(ans.length?ans.map((c,n)=>'<div class="answer-tile" data-from="answer" data-index="'+n+'">'+esc(c)+'</div>').join(''):'<span class="placeholder">Натисніть на літери вище</span>')+'</div>'+(f?'<div class="feedback '+f+'">'+(f==='correct'?'Правильно!':'Спробуйте ще раз')+'</div>':'')+'<div class="controls"><button data-action="check" '+(!ans.length?'disabled':'')+'>Перевірити</button><button data-action="clear" '+(!ans.length?'disabled':'')+'>Очистити</button><button data-action="shuffle">Перемішати</button><button class="btn-primary" data-action="next" '+(!done?'disabled':'')+'>Далі</button></div><div class="score-note">Правильні відповіді: '+state.scores[k]+' з '+state.answered[k]+'</div></div></div>'}
function move(from,n){const k=state.page;if(from==='tiles'){state.answers[k].push(state.tiles[k].splice(n,1)[0])}else{state.tiles[k].push(state.answers[k].splice(n,1)[0])}state.feedback[k]='';render()}
function next(){const k=state.page,i=state.index[k];if(i<PAGES[k].words.length-1){state.index[k]++;state.answers[k]=[];state.feedback[k]='';state.tiles[k]=scramble(PAGES[k].words[state.index[k]])}else{const pos=keys.indexOf(k);if(pos<keys.length-1){state.page=keys[pos+1]}else state.results=true}render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-page],[data-from]');if(!el)return;if(el.dataset.page){state.page=el.dataset.page;state.feedback[state.page]='';render();return}if(el.dataset.from){move(el.dataset.from,Number(el.dataset.index));return}const a=el.dataset.action,k=state.page;if(a==='check'){const ok=state.answers[k].join('')===PAGES[k].words[state.index[k]];state.feedback[k]=ok?'correct':'incorrect';if(ok){state.scores[k]++;state.answered[k]++}render()}else if(a==='clear'){state.tiles[k]=state.tiles[k].concat(state.answers[k]);state.answers[k]=[];state.feedback[k]='';render()}else if(a==='shuffle'){state.tiles[k]=shuffle(state.tiles[k]);render()}else if(a==='next')next();else if(a==='restart'){state={page:'family',index:{family:0,professions:0,numbers:0},answers:{family:[],professions:[],numbers:[]},tiles:{family:[],professions:[],numbers:[]},feedback:{family:'',professions:'',numbers:''},scores:{family:0,professions:0,numbers:0},answered:{family:0,professions:0,numbers:0},results:false};init()}});
init();
</script>
</body>
</html>
